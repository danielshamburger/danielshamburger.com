<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>👋 Hi, I'm Daniel.</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- <link href="https://fonts.googleapis.com/css?family=Inter:400,700" rel="stylesheet"> -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=UA-22563082-1"></script>
	<style>
		html, body {
			height: 100%;
			overflow: hidden;
			padding: 0;
			margin: 0;
		}
		body {
			/*font-family: 'Inter';*/
			font-family: 'Arial', sans-serif;
			/*display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;*/
			background-color: #FFFFF9;
		}
		h1 {
			font-weight: normal;
			font-size: 48px;
		}
		header {
			display: flex;
			justify-content: space-between;
			height: 120px;
			padding: 4px;
		}
		#openExplanation {
			font-size: 32px;
			background: transparent;
			border-radius: 50%;
			width: 50px;
			height: 50px;
			text-align: center;
			display: block;
			border: 1px solid black;
			padding: 0;
		}
		main {
			height: calc( 100vh - 250px );
			display: flex;
			flex-direction: column;
			padding: 4px;
			justify-content: center;
			align-items: center;
		}
		section {
			max-width: 450px;
		}
		#explanation {
			border: 1px solid black;
			background: #fff;
			max-width: 200px;
			position: absolute;
    		top: 50%; 
    		left: 50%;
    		transform: translate(-50%, -50%);
    		padding: 3px;
    		box-shadow: 0px 4px 10px grey;
    		display: none;
		}
		#explanation.open {
			display: block;
		}
		#closeExplanation {
			background: red;
			color: white;
			border-radius: 50%;
			width: 40px;
			height: 40px;
			display: block;
			border: 0;
			font-size: 18px;
			text-align: center;
			padding: 0;
		}
		.button {
			border: 1px solid #444;
			border-radius: 13px;
			color: #666;
			font-size: 13px;
			background: transparent;
			text-decoration: underline;
			padding: 5px;
		}
		h2 {
			font-weight: normal;
			margin-bottom: 25px;
		}
	</style>
</head>
<body>
	<header>
		<h1>Daniel<br /> Shamburger</h1>
		<button id="openExplanation">?</button>
	</header>
	<main>
		<section>
			<h2>👋 Welcome to my web page</h2>
			<p><strong>Professional:</strong> Find me on <a class="button" href="https://www.linkedin.com/in/danielshamburger/">LinkedIn 👉</a> or <a class="button" href="https://github.com/danielshamburger/">GitHub 👉</a></p>
			<p><strong>Personal:</strong> Try <a class="button" href="https://www.instagram.com/danielshamburger/">Instagram 👉</a> or <a class="button" href="https://www.strava.com/athletes/2136969">Strava 👉</a></p>
			<p><strong>Good old email:</strong>&nbsp;<span class="button">hello@[thisdomain] ✉️</span></a></p>
		</section>
	</main>
	<div id="explanation">
		<button id="closeExplanation">X</button>
		<p>This website is intentionally <a target="_blank" rel="noreferrer" href="https://brutalistwebsites.com/">"ugly"</a>.</p> 
		<p>I think it's kinda fun. 😄</p>
	</div>

	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag(){dataLayer.push(arguments);}
		gtag('js', new Date());

		gtag('config', 'UA-22563082-1');

		const openExplanation = document.getElementById('openExplanation');
		const closeExplanation = document.getElementById('closeExplanation');
	  	const explanation = document.getElementById('explanation');

	  	openExplanation.addEventListener('click', () => {
	  		explanation.classList.add('open');
	  	});

	  	closeExplanation.addEventListener('click', () => {
	  		explanation.classList.remove('open');
	  	});

	</script>
</body>
</html>
