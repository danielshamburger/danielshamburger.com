<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Daniel Shamburger &middot; software developer</title>
	<meta name="description" content="Daniel Shamburger makes software and rides bikes.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://danielshamburger.com/">
	<meta property="og:title" content="Daniel Shamburger">
	<meta property="og:description" content="Makes software. Rides bikes.">
	<meta property="og:image" content="https://danielshamburger.com/og.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="A green name tag that reads: hello, my name is Daniel Shamburger.">
	<meta name="twitter:card" content="summary_large_image">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'><circle cx='.5' cy='.5' r='.5' fill='%2381c08b'/></svg>">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600..800&display=swap">
	<style>
		/* Typed so they can be animated: the page color and the scroll percentage */
		@property --bg {
			syntax: "<color>";
			inherits: true;
			initial-value: #81c08b;
		}
		@property --percent {
			syntax: "<integer>";
			inherits: true;
			initial-value: 0;
		}
		:root {
			--ink: #2a2a2a;
			--line: 2px solid var(--ink);
			--mono: ui-monospace, SFMono-Regular, Menlo, monospace;
			--gap: 24px;
			--section: calc(100svh - 2 * var(--gap));
			--aside: clamp(160px, 25vw, 320px);
			--row: 3rem;
		}
		@media (prefers-reduced-motion: no-preference) {
			html { scroll-behavior: smooth; }
		}
		/* The browser drives color and percentage straight from the scroll position. Its stops are evenly spaced, so the
		   script takes over (.scripted-scroll) in browsers without scroll timelines or when content stretches a section */
		@supports (animation-timeline: scroll()) {
			:root:not(.scripted-scroll) {
				animation: page-scroll linear both;
				animation-timeline: scroll(root);
			}
		}
		/* One stop per section; the first color is also the favicon fill */
		@keyframes page-scroll {
			0% { --bg: #81c08b; --percent: 0; }
			33.333% { --bg: #f0c3d8; }
			66.667% { --bg: #89bee3; }
			100% { --bg: #ecdf8a; --percent: 100; }
		}
		* {
			box-sizing: border-box;
			margin: 0;
		}
		body {
			display: grid;
			grid-template-columns: minmax(0, 1fr) var(--aside);
			padding: var(--gap);
			background: var(--bg);
			color: var(--ink);
			font-family: Inter, system-ui, sans-serif;
		}
		/* Fixed frame: masks the gutters and draws the outer line while the page scrolls (and bounces) underneath */
		body::after {
			content: "";
			position: fixed;
			inset: 0;
			border: var(--gap) solid var(--bg);
			box-shadow: inset 0 0 0 2px var(--ink);
			pointer-events: none;
		}
		a, button {
			color: inherit;
		}

		section {
			display: flex;
			flex-direction: column;
			justify-content: center;
			min-height: var(--section);
			padding: 3.5vw;
		}
		h1, h2, .links a {
			font-weight: 800;
			letter-spacing: -0.05em;
			line-height: 0.95;
		}
		.mono {
			font-family: var(--mono);
		}

		/* Name tag: ink band on top, name in the open space below */
		.intro {
			padding: 0;
		}
		.intro header {
			display: flex;
			align-items: center;
			height: var(--row);
			padding: 0 3.5vw;
			background: var(--ink);
			color: var(--bg);
			font-size: 0.9rem;
			letter-spacing: 0.3em;
		}
		.intro h1 {
			margin-block: auto;
			padding: 3.5vw;
			font-size: clamp(3rem, 8vw, 8rem);
			/* Pull the large letters' built-in side spacing back so they line up with the label above */
			margin-left: -0.04em;
		}

		.about p {
			font-size: clamp(2rem, 5vw, 4.5rem);
			font-weight: 600;
			letter-spacing: -0.04em;
			line-height: 1.1;
		}

		.links, .links ul {
			padding: 0;
		}
		.links a {
			display: block;
			padding: clamp(1rem, 4svh, 2rem) 3.5vw;
			font-size: clamp(2.5rem, 6vw, 5rem);
			text-decoration: none;
		}
		.links li + li {
			border-top: var(--line);
		}
		.links span {
			position: relative;
			display: inline-block;
			/* Cap height, so the arrow stands as tall as the capitals */
			width: 0.72em;
			margin-left: 0.25em;
		}
		.links span svg {
			display: block;
			overflow: visible;
		}
		/* Matches the text underline, which can't reach an SVG */
		.links span::after {
			content: "";
			position: absolute;
			inset-inline: 0;
			top: calc(100% + 0.12em);
			height: 0.08em;
			background: currentColor;
			visibility: hidden;
		}
		.links a:is(:hover, :focus-visible) {
			background: var(--ink);
			color: var(--bg);
			outline: none;
			text-decoration: underline 0.08em;
			text-underline-offset: 0.12em;
		}
		.links a:is(:hover, :focus-visible) span::after {
			visibility: visible;
		}

		.contact h2 {
			font-size: clamp(2.5rem, 6vw, 5rem);
			margin-bottom: 1.5rem;
		}
		.terminal {
			display: flex;
			background: var(--ink);
			color: var(--bg);
		}
		.terminal code {
			flex: 1;
			min-width: 0;
			padding: 1.5rem;
			/* Base64 has no spaces, so allow breaks anywhere */
			overflow-wrap: anywhere;
			font-size: clamp(0.8rem, 1.4vw, 1.1rem);
		}
		.terminal button {
			flex: none;
			width: 11ch;
			border: 0;
			border-left: 3px solid var(--bg);
			background: none;
			color: inherit;
			letter-spacing: 0.15em;
			cursor: pointer;
		}

		aside {
			position: fixed;
			top: var(--gap);
			right: var(--gap);
			width: var(--aside);
			display: grid;
			grid-template-rows: var(--row) 1fr min(13rem, 35svh);
			height: var(--section);
			border-left: var(--line);
			background: var(--bg);
		}
		.progress {
			display: grid;
			place-items: center;
			background: linear-gradient(to right, var(--ink) calc(var(--percent) * 1%), transparent 0);
			font-size: 0.9rem;
			font-weight: 700;
			transition: color 0.3s;
		}
		.progress::before {
			counter-reset: percent var(--percent);
			content: counter(percent) "%";
		}
		.progress.filled {
			color: var(--bg);
		}
		.dots {
			--bleed: 24px;
			position: relative;
			cursor: none;
		}
		/* Bleeds past the area so pushed dots can escape its edges; ignores the pointer so it never covers the arrow */
		.dots canvas {
			position: absolute;
			inset: calc(-1 * var(--bleed));
			width: calc(100% + 2 * var(--bleed));
			height: calc(100% + 2 * var(--bleed));
			pointer-events: none;
		}
		.next {
			display: grid;
			place-items: center;
			border: 0;
			background: none;
			cursor: pointer;
			transition: background 0.2s, color 0.2s;
		}
		.next:is(:hover, :focus-visible) {
			background: var(--ink);
			color: var(--bg);
			outline: none;
		}
		.next svg {
			width: min(50%, 7rem);
			transition: rotate 0.4s;
		}
		.next.top svg {
			rotate: 180deg;
		}


		@media (prefers-reduced-motion: reduce) {
			.next svg {
				transition: none;
			}
		}

		@media (max-width: 700px) {
			:root {
				--gap: 12px;
				--bar: 5rem;
				--section: calc(100svh - 2 * var(--gap) - var(--bar));
			}
			body {
				grid-template-columns: minmax(0, 1fr);
				padding-bottom: calc(var(--gap) + var(--bar));
			}
			aside {
				top: auto;
				bottom: var(--gap);
				left: var(--gap);
				width: auto;
				grid-template: auto / 1fr 1fr var(--bar);
				height: var(--bar);
				border-left: 0;
				border-top: var(--line);
			}
			.next svg { width: 2.5rem; }
		}
	</style>
</head>
<body>
	<main>
		<section class="intro">
			<header class="mono">hello, my name is</header>
			<h1><span data-picture="hello">Daniel<br>Shamburger</span></h1>
		</section>
		<section class="about">
			<p>Makes software.<br>Rides bikes.</p>
		</section>
		<section class="links">
			<ul role="list">
				<li><a href="https://www.linkedin.com/in/danielshamburger/" data-picture="linkedin">LinkedIn<span aria-hidden="true"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor"><path d="M1 13 13 1M3.5 1H13v9.5"/></svg></span></a></li>
				<li><a href="https://github.com/danielshamburger/" data-picture="github">GitHub<span aria-hidden="true"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor"><path d="M1 13 13 1M3.5 1H13v9.5"/></svg></span></a></li>
				<li><a href="https://www.strava.com/athletes/2136969" data-picture="strava">Strava<span aria-hidden="true"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor"><path d="M1 13 13 1M3.5 1H13v9.5"/></svg></span></a></li>
			</ul>
		</section>
		<section class="contact">
			<h2>Get in touch</h2>
			<div class="terminal mono">
				<code>aGVsbG9AZGFuaWVsc2hhbWJ1cmdlci5jb20=</code>
				<button class="mono" type="button" aria-live="polite">COPY</button>
			</div>
		</section>
	</main>
	<aside>
		<div class="progress mono" aria-hidden="true"></div>
		<div class="dots" aria-hidden="true"><canvas></canvas></div>
		<button class="next" type="button" aria-label="Next section">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="miter">
				<path d="M12 2v20M3 13l9 9 9-9"/>
			</svg>
		</button>
	</aside>

	<script type="module">
		const arrow = document.querySelector('.next');

		scrollEffects();
		dotGrid();
		copyButton();

		// Color and percentage come from CSS scroll-driven animations; this handles the thresholds
		// (arrow flip, progress label color) and drives color and percentage itself where CSS can't
		function scrollEffects() {
			const root = document.documentElement;
			const sections = [...document.querySelectorAll('section')];
			const progress = document.querySelector('.progress');
			const supported = CSS.supports('animation-timeline: scroll()');
			// Same stops as @keyframes page-scroll
			const colors = [[129, 192, 139], [240, 195, 216], [137, 190, 227], [236, 223, 138]];
			let starts, maxScroll, scripted, filled, atEnd;

			// Measured on resize only, so scrolling never forces a layout
			function measure() {
				// The scroll position at which each section reaches the top of the frame
				starts = sections.map(section => section.offsetTop - sections[0].offsetTop);
				maxScroll = root.scrollHeight - innerHeight;
				const height = sections[0].offsetHeight;
				scripted = !supported || sections.some(section => Math.abs(section.offsetHeight - height) > 1);
				root.classList.toggle('scripted-scroll', scripted);
				if (!scripted) {
					root.style.removeProperty('--bg');
					root.style.removeProperty('--percent');
				}
				update();
			}

			function update() {
				// Clamped because macOS overscroll reports positions past either end
				const scroll = Math.min(Math.max(scrollY, 0), maxScroll);
				const percent = Math.round(scroll / maxScroll * 100);

				if (scripted) {
					// Blend between the colors of the sections on either side of the scroll position
					const i = Math.min(Math.max(starts.findLastIndex(start => start <= scroll), 0), colors.length - 2);
					const t = Math.min((scroll - starts[i]) / (starts[i + 1] - starts[i]), 1);
					const rgb = colors[i].map((c, n) => Math.round(c + (colors[i + 1][n] - c) * t));
					root.style.setProperty('--bg', `rgb(${rgb})`);
					root.style.setProperty('--percent', percent);
				}

				if (percent >= 50 !== filled) {
					filled = percent >= 50;
					progress.classList.toggle('filled', filled);
				}

				// Flips once the last section is more than halfway in
				const nextAtEnd = scroll >= (starts.at(-2) + starts.at(-1)) / 2;
				if (nextAtEnd !== atEnd) {
					atEnd = nextAtEnd;
					arrow.classList.toggle('top', atEnd);
					arrow.ariaLabel = atEnd ? 'Back to top' : 'Next section';
				}
			}

			arrow.addEventListener('click', () => {
				scrollTo({ top: atEnd ? 0 : starts.find(start => start > scrollY + 1) ?? 0 });
			});
			addEventListener('scroll', update);
			addEventListener('resize', measure);
			// Catches sections growing after fonts load or text is resized
			new ResizeObserver(measure).observe(document.querySelector('main'));
			measure();
		}

		// Dots push away from a field (the pointer, the hovered arrow or the load-time hint) and grow as it gets close;
		// clicks send out a shockwave
		function dotGrid() {
			const SPACING = 14, MARGIN = 12, RADIUS = 1.5, REACH = 100, PUSH = 18, GROW = 1.4, EASE = 0.2;
			const BURST_DURATION = 600, BURST_REACH = 320, BURST_WIDTH = 30, BURST_PUSH = 18, BURST_GROW = 1.5;
			const HINT_DELAY = 1000, HINT_DURATION = 1200, HINT_STRENGTH = 0.7, HINT_FROM = 0.15, HINT_TO = 0.85;
			const ARROW_REACH = 170, PICTURE_GROW = 1.3, PICTURE_DIM = 0.6;
			// One character per dot; at most 11 wide so they fit the narrowest sidebar
			const PICTURES = {
				hello: [
					'##.....##',
					'##.....##',
					'##.......',
					'######.##',
					'##..##.##',
					'##..##.##',
					'##..##.##',
					'##..##.##',
					'##..##.##',
				],
				linkedin: [
					'##.........',
					'##.........',
					'...........',
					'##.##.###..',
					'##.#######.',
					'##.##...##.',
					'##.##...##.',
					'##.##...##.',
					'##.##...##.',
				],
				github: [
					'.#########.',
					'.#.#.....#.',
					'.#..#....#.',
					'.#.#.....#.',
					'.#.......#.',
					'.#########.',
					'###########',
				],
				strava: [
					'..###..##..',
					'...#....#..',
					'...######..',
					'...#..#.#..',
					'.##.##..##.',
					'#..#.#.#..#',
					'#..#...#..#',
					'.##.....##.',
				],
			};

			const area = document.querySelector('.dots');
			const canvas = area.querySelector('canvas');
			const ctx = canvas.getContext('2d');
			const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink');
			const bleed = Number.parseFloat(getComputedStyle(area).getPropertyValue('--bleed'));

			let width, height, cols, rows, dots = [], outside;
			let field = { x: 0, y: 0, reach: REACH, cursor: false };
			let strength = 0, target = 0, bursts = [], hint = null, frame = null, picture = null, dim = 0;

			// Moves a value a step toward its goal, snapping once it's close enough to stop animating
			const ease = (value, goal) => {
				const next = value + (goal - value) * EASE;
				return Math.abs(goal - next) < 0.001 ? goal : next;
			};

			function layout() {
				({ width, height } = area.getBoundingClientRect());
				canvas.width = (width + 2 * bleed) * devicePixelRatio;
				canvas.height = (height + 2 * bleed) * devicePixelRatio;
				// Draw in the area's coordinates; the bleed sits at negative/overflow positions
				ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, bleed * devicePixelRatio, bleed * devicePixelRatio);

				// Same margin on every side; spacing stretches a fraction of a pixel per axis to fit exactly
				const axis = size => {
					const n = Math.max(1, Math.round((size - 2 * MARGIN) / SPACING));
					return Array.from({ length: n + 1 }, (_, i) => MARGIN + i * (size - 2 * MARGIN) / n);
				};
				const xs = axis(width), ys = axis(height);
				cols = xs.length;
				rows = ys.length;
				dots = ys.flatMap((y, row) => xs.map((x, col) => ({ x, y, col, row, lit: 0 })));

				// The bleed ring around the area, where shapes are drawn in ink instead of cut out
				outside = new Path2D();
				outside.rect(-bleed, -bleed, width + 2 * bleed, height + 2 * bleed);
				outside.rect(0, 0, width, height);

				draw(performance.now());
			}

			// Advances the animation state; returns whether anything is still moving
			function step(now) {
				if (hint) {
					// Sweep a cursor-less bulge from top to bottom, then end with a burst
					const t = Math.min((now - hint.start) / HINT_DURATION, 1);
					const eased = (1 - Math.cos(t * Math.PI)) / 2;
					field = { x: width / 2, y: height * (HINT_FROM + (HINT_TO - HINT_FROM) * eased), reach: REACH, cursor: false };
					strength = Math.sin(t * Math.PI) * HINT_STRENGTH;
					if (t === 1) {
						hint = null;
						bursts.push({ x: field.x, y: field.y, start: now });
					}
				} else {
					strength = ease(strength, target);
				}
				bursts = bursts.filter(burst => now - burst.start < BURST_DURATION);

				// The hovered link's picture: its dots grow, the rest shrink, centered in the grid
				const bitmap = PICTURES[picture];
				const fits = Boolean(bitmap) && bitmap.length <= rows && bitmap[0].length <= cols;
				const top = Math.floor((rows - bitmap?.length) / 2), left = Math.floor((cols - bitmap?.[0].length) / 2);
				dim = ease(dim, fits ? 1 : 0);
				let settled = dim === (fits ? 1 : 0);
				for (const dot of dots) {
					const goal = fits && bitmap[dot.row - top]?.[dot.col - left] === '#' ? 1 : 0;
					dot.lit = ease(dot.lit, goal);
					settled &&= dot.lit === goal;
				}

				return Boolean(hint) || bursts.length > 0 || strength !== target || !settled;
			}

			function draw(now) {
				ctx.globalCompositeOperation = 'source-over';
				ctx.globalAlpha = 1;
				ctx.clearRect(-bleed, -bleed, width + 2 * bleed, height + 2 * bleed);
				ctx.fillStyle = ctx.strokeStyle = ink;
				ctx.fillRect(0, 0, width, height);

				const path = new Path2D();
				for (const { x, y, lit } of dots) {
					const dx = x - field.x, dy = y - field.y, distance = Math.hypot(dx, dy) || 1;
					const falloff = strength * Math.max(0, 1 - distance / field.reach) ** 2;
					let cx = x + dx / distance * falloff * PUSH, cy = y + dy / distance * falloff * PUSH;
					let r = RADIUS * (1 + GROW * falloff + PICTURE_GROW * lit - PICTURE_DIM * dim * (1 - lit));

					// Each burst is a ring that expands from the click and fades as it goes
					for (const burst of bursts) {
						const age = (now - burst.start) / BURST_DURATION;
						const bx = x - burst.x, by = y - burst.y, d = Math.hypot(bx, by) || 1;
						const wave = Math.max(0, 1 - Math.abs(d - age * BURST_REACH) / BURST_WIDTH) * (1 - age) ** 2;
						cx += bx / d * wave * BURST_PUSH;
						cy += by / d * wave * BURST_PUSH;
						r += RADIUS * BURST_GROW * wave;
					}
					path.moveTo(cx + r, cy);
					path.arc(cx, cy, r, 0, Math.PI * 2);
				}
				cut(path, 'fill');

				if (field.cursor && strength > 0.01) {
					ctx.globalAlpha = strength;
					ctx.lineWidth = 2;
					cut(cursor(), 'stroke');
				}
			}

			// Inside the area, punch the shape out of the ink; outside it, draw the shape in ink so it reads the same
			function cut(path, method) {
				ctx.globalCompositeOperation = 'destination-out';
				ctx[method](path);

				ctx.save();
				ctx.clip(outside, 'evenodd');
				ctx.globalCompositeOperation = 'source-over';
				ctx[method](path);
				ctx.restore();
			}

			// Rounded viewfinder brackets
			function cursor() {
				const half = 14, corner = 3, arm = 4, path = new Path2D();
				for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
					const x = field.x + sx * half, y = field.y + sy * half;
					path.moveTo(x, y - sy * (corner + arm));
					path.arcTo(x, y, x - sx * corner, y, corner);
					path.lineTo(x - sx * (corner + arm), y);
				}
				return path;
			}

			function tick() {
				const now = performance.now();
				const moving = step(now);
				draw(now);
				frame = moving ? requestAnimationFrame(tick) : null;
			}

			function animate() {
				frame ??= requestAnimationFrame(tick);
			}

			function attract(x, y, { reach = REACH, cursor = false } = {}) {
				hint = null;
				field = { x, y, reach, cursor };
				target = 1;
				animate();
			}

			function release() {
				target = 0;
				animate();
			}

			area.addEventListener('pointermove', e => attract(e.offsetX, e.offsetY, { cursor: true }));
			area.addEventListener('pointerleave', release);
			area.addEventListener('pointerdown', e => {
				bursts.push({ x: e.offsetX, y: e.offsetY, start: performance.now() });
				animate();
			});

			// Hovering the arrow pushes dots away from its nearest edge
			arrow.addEventListener('pointerenter', () => {
				const a = area.getBoundingClientRect(), b = arrow.querySelector('svg').getBoundingClientRect();
				const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
				attract(
					clamp(a.left + width / 2, b.left, b.right) - a.left,
					clamp(a.top + height / 2, b.top, b.bottom) - a.top,
					{ reach: ARROW_REACH },
				);
			});
			arrow.addEventListener('pointerleave', release);

			// Hovering the name or hovering/focusing a link draws its picture
			for (const link of document.querySelectorAll('[data-picture]')) {
				const show = name => () => {
					picture = name;
					if (name) hint = null;
					animate();
				};
				link.addEventListener('pointerenter', show(link.dataset.picture));
				link.addEventListener('focus', show(link.dataset.picture));
				link.addEventListener('pointerleave', show(null));
				link.addEventListener('blur', show(null));
			}

			new ResizeObserver(layout).observe(area);

			if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
				setTimeout(() => {
					if (target || picture) return;
					hint = { start: performance.now() };
					animate();
				}, HINT_DELAY);
			}
		}

		// Copies the encoded address; if the clipboard is blocked, selects it for a manual copy instead
		function copyButton() {
			const button = document.querySelector('.terminal button');
			const code = document.querySelector('.terminal code');
			let reset;

			button.addEventListener('click', async () => {
				try {
					await navigator.clipboard.writeText(code.textContent);
					button.textContent = 'COPIED';
				} catch {
					getSelection().selectAllChildren(code);
					button.textContent = 'FAILED';
				}
				clearTimeout(reset);
				reset = setTimeout(() => button.textContent = 'COPY', 1500);
			});
		}
	</script>
</body>
</html>
