<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Daniel Shamburger &middot; software developer</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'><circle cx='.5' cy='.5' r='.5' fill='%2381c08b'/></svg>">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600..800&display=swap">
	<style>
		:root {
			--bg: #81c08b;
			--ink: #1c1c1c;
			--line: 2px solid var(--ink);
			--mono: ui-monospace, SFMono-Regular, Menlo, monospace;
			--gap: 24px;
			--section: calc(100svh - 2 * var(--gap));
			--aside: clamp(160px, 25vw, 320px);
			--row: 3rem;
		}
		@media (prefers-reduced-motion: no-preference) {
			html { scroll-behavior: smooth; }
		}
		* {
			box-sizing: border-box;
			margin: 0;
		}
		body {
			display: grid;
			grid-template-columns: minmax(0, 1fr) var(--aside);
			padding: var(--gap);
			background: var(--bg);
			color: var(--ink);
			font-family: Inter, system-ui, sans-serif;
		}
		/* Fixed frame: masks the gutters and draws the outer line while the page scrolls (and bounces) underneath */
		body::after {
			content: "";
			position: fixed;
			inset: 0;
			border: var(--gap) solid var(--bg);
			box-shadow: inset 0 0 0 2px var(--ink);
			pointer-events: none;
		}
		a, button {
			color: inherit;
		}

		section {
			display: flex;
			flex-direction: column;
			justify-content: center;
			height: var(--section);
			padding: 3.5vw;
		}
		h1, h2, .links a {
			font-weight: 800;
			letter-spacing: -0.05em;
			line-height: 0.95;
		}
		.mono {
			font-family: var(--mono);
		}

		/* Name tag: ink band on top, name in the open space below */
		.intro {
			padding: 0;
		}
		.intro header {
			display: flex;
			align-items: center;
			height: var(--row);
			padding: 0 3.5vw;
			background: var(--ink);
			color: var(--bg);
			font-size: 0.9rem;
			letter-spacing: 0.3em;
		}
		.intro h1 {
			display: grid;
			flex: 1;
			align-content: center;
			padding: 3.5vw;
			font-size: clamp(3rem, 8vw, 8rem);
			/* Pull the large letters' built-in side spacing back so they line up with the label above */
			margin-left: -0.04em;
		}

		.about p {
			font-size: clamp(2rem, 5vw, 4.5rem);
			font-weight: 600;
			letter-spacing: -0.04em;
			line-height: 1.1;
		}

		.links, .links ul {
			padding: 0;
		}
		.links a {
			position: relative;
			display: block;
			padding: 2rem 3.5vw;
			font-size: clamp(2.5rem, 6vw, 5rem);
			text-decoration: none;
			transition: padding-left 0.25s;
		}
		.links a::before {
			content: attr(data-icon);
			position: absolute;
			top: 50%;
			left: 3.5vw;
			translate: 0 -50%;
			font-size: 0.8em;
			opacity: 0;
			transition: opacity 0.25s;
		}
		.links li + li {
			border-top: var(--line);
		}
		.links span {
			display: inline-block;
			margin-left: 0.2em;
			font-weight: 300;
		}
		.links a:is(:hover, :focus-visible) {
			background: var(--ink);
			color: #fafafa;
			outline: none;
			padding-left: calc(3.5vw + 1.2em);
		}
		.links a:is(:hover, :focus-visible)::before {
			opacity: 1;
		}
		.links a:is(:hover, :focus-visible),
		.links a:is(:hover, :focus-visible) span {
			text-decoration: underline 0.08em;
			text-underline-offset: 0.12em;
		}

		.contact h2 {
			font-size: clamp(2.5rem, 6vw, 5rem);
			margin-bottom: 1.5rem;
		}
		.terminal {
			display: flex;
			background: var(--ink);
			color: var(--bg);
		}
		.terminal code {
			flex: 1;
			min-width: 0;
			padding: 1.5rem;
			overflow-x: auto;
			white-space: nowrap;
			font-size: clamp(0.8rem, 1.4vw, 1.1rem);
		}
		.terminal button {
			flex: none;
			width: 11ch;
			border: 0;
			border-left: 3px solid var(--bg);
			background: none;
			color: inherit;
			letter-spacing: 0.15em;
			cursor: pointer;
		}

		aside {
			position: fixed;
			top: var(--gap);
			right: var(--gap);
			width: var(--aside);
			display: grid;
			grid-template-rows: var(--row) 1fr 13rem;
			height: var(--section);
			border-left: var(--line);
			background: var(--bg);
		}
		.progress {
			display: grid;
			place-items: center;
			background: linear-gradient(to right, var(--ink) var(--progress, 0%), transparent 0);
			font-size: 0.9rem;
			font-weight: 700;
			transition: color 0.3s;
		}
		.progress.filled {
			color: var(--bg);
		}
		/* Ink with transparent holes over the aside's background, so the layer never repaints when --bg changes */
		.dots {
			background: radial-gradient(transparent 1.5px, var(--ink) 2px) 0 0 / 14px 14px;
			border-block: 4px solid var(--ink);
			will-change: transform;
		}
		.next {
			display: grid;
			place-items: center;
			border: 0;
			background: none;
			cursor: pointer;
		}
		.next svg {
			width: min(50%, 7rem);
			transition: rotate 0.4s;
		}
		.next.top svg {
			rotate: 180deg;
		}

		@media (max-width: 700px) {
			:root {
				--gap: 12px;
				--bar: 5rem;
				--section: calc(100svh - 2 * var(--gap) - var(--bar));
			}
			body {
				grid-template-columns: minmax(0, 1fr);
				padding-bottom: calc(var(--gap) + var(--bar));
			}
			aside {
				top: auto;
				bottom: var(--gap);
				left: var(--gap);
				width: auto;
				grid-template: auto / 1fr 1fr var(--bar);
				height: var(--bar);
				border-left: 0;
				border-top: var(--line);
			}
			.dots { border-block: 0; }
			.next svg { width: 2.5rem; }
		}
	</style>
</head>
<body>
	<main>
		<section class="intro">
			<header class="mono">hello my name is</header>
			<h1>Daniel<br>Shamburger</h1>
		</section>
		<section class="about">
			<p>Makes software.<br>Rides bikes.</p>
		</section>
		<section class="links">
			<ul role="list">
				<li><a href="https://www.linkedin.com/in/danielshamburger/" data-icon="🧑‍💼">LinkedIn<span>↗</span></a></li>
				<li><a href="https://github.com/danielshamburger/" data-icon="👨‍💻">GitHub<span>↗</span></a></li>
				<li><a href="https://www.strava.com/athletes/2136969" data-icon="🚴🏻‍♂️">Strava<span>↗</span></a></li>
			</ul>
		</section>
		<section class="contact">
			<h2>Get in touch</h2>
			<div class="terminal mono">
				<code>aGVsbG9AZGFuaWVsc2hhbWJ1cmdlci5jb20=</code>
				<button class="mono" type="button">COPY</button>
			</div>
		</section>
	</main>
	<aside>
		<div class="progress mono">0%</div>
		<div class="dots"></div>
		<button class="next" type="button" aria-label="Next section">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="miter">
				<path d="M12 2v20M3 13l9 9 9-9"/>
			</svg>
		</button>
	</aside>

	<script>
		const colors = [[129, 192, 139], [240, 195, 216], [137, 190, 227], [236, 223, 138]];
		const section = document.querySelector('section');
		const progress = document.querySelector('.progress');
		const next = document.querySelector('.next');
		const copy = document.querySelector('.terminal button');

		function update() {
			const position = scrollY / section.offsetHeight;
			const i = Math.min(Math.floor(position), colors.length - 2);
			const t = Math.min(position - i, 1);
			const rgb = colors[i].map((c, n) => Math.round(c + (colors[i + 1][n] - c) * t));
			document.documentElement.style.setProperty('--bg', `rgb(${rgb})`);

			const percent = Math.round(scrollY / (document.documentElement.scrollHeight - innerHeight) * 100);
			progress.textContent = percent + '%';
			progress.style.setProperty('--progress', percent + '%');
			progress.classList.toggle('filled', percent >= 50);

			const atEnd = Math.round(position) === colors.length - 1;
			next.classList.toggle('top', atEnd);
			next.ariaLabel = atEnd ? 'Back to top' : 'Next section';
		}

		next.addEventListener('click', () => {
			const atEnd = next.classList.contains('top');
			const index = Math.floor(scrollY / section.offsetHeight + 0.01) + 1;
			scrollTo({ top: atEnd ? 0 : index * section.offsetHeight });
		});

		copy.addEventListener('click', async () => {
			await navigator.clipboard.writeText(document.querySelector('.terminal code').textContent);
			copy.textContent = 'COPIED';
			setTimeout(() => copy.textContent = 'COPY', 1500);
		});

		addEventListener('scroll', update);
		addEventListener('resize', update);
		update();
	</script>
</body>
</html>
