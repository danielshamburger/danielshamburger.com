<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Daniel Shamburger &middot; software developer</title>
	<meta name="description" content="Daniel Shamburger makes software and rides bikes.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://danielshamburger.com/">
	<meta property="og:title" content="Daniel Shamburger">
	<meta property="og:description" content="Makes software. Rides bikes.">
	<meta property="og:image" content="https://danielshamburger.com/og.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="A green name tag that reads: hello, my name is Daniel Shamburger.">
	<meta name="twitter:card" content="summary_large_image">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'><circle cx='.5' cy='.5' r='.5' fill='%2381c08b'/></svg>">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600..800&display=swap">
	<style>
		/* Typed so they can be animated: the page color and the scroll percentage */
		@property --bg {
			syntax: "<color>";
			inherits: true;
			initial-value: #81c08b;
		}
		@property --percent {
			syntax: "<integer>";
			inherits: true;
			initial-value: 0;
		}
		:root {
			--ink: #2a2a2a;
			--line: 2px solid var(--ink);
			--mono: ui-monospace, SFMono-Regular, Menlo, monospace;
			--gap: 24px;
			--section: calc(100svh - 2 * var(--gap));
			--aside: clamp(160px, 25vw, 320px);
			--row: 3rem;
		}
		@media (prefers-reduced-motion: no-preference) {
			html { scroll-behavior: smooth; }
		}
		/* The browser drives color and percentage straight from the scroll position. Its stops are evenly spaced, so the
		   script takes over (.scripted-scroll) in browsers without scroll timelines or when content stretches a section */
		@supports (animation-timeline: scroll()) {
			:root:not(.scripted-scroll) {
				animation: page-scroll linear both;
				animation-timeline: scroll(root);
			}
		}
		/* One stop per section; the first color is also the favicon fill */
		@keyframes page-scroll {
			0% { --bg: #81c08b; --percent: 0; }
			33.333% { --bg: #f0c3d8; }
			66.667% { --bg: #89bee3; }
			100% { --bg: #ecdf8a; --percent: 100; }
		}
		* {
			box-sizing: border-box;
			margin: 0;
		}
		body {
			display: grid;
			grid-template-columns: minmax(0, 1fr) var(--aside);
			padding: var(--gap);
			background: var(--bg);
			color: var(--ink);
			font-family: Inter, system-ui, sans-serif;
		}
		/* Fixed frame: masks the gutters and draws the outer line while the page scrolls (and bounces) underneath */
		body::after {
			content: "";
			position: fixed;
			inset: 0;
			border: var(--gap) solid var(--bg);
			box-shadow: inset 0 0 0 2px var(--ink);
			pointer-events: none;
		}
		a, button {
			color: inherit;
		}

		section {
			display: flex;
			flex-direction: column;
			justify-content: center;
			min-height: var(--section);
			padding: 3.5vw;
		}
		h1, h2, .links a {
			font-weight: 800;
			letter-spacing: -0.05em;
			line-height: 0.95;
		}
		.mono {
			font-family: var(--mono);
		}

		/* Name tag: ink band on top, name in the open space below */
		.intro {
			padding: 0;
		}
		.intro header {
			display: flex;
			align-items: center;
			height: var(--row);
			padding: 0 3.5vw;
			background: var(--ink);
			color: var(--bg);
			font-size: 0.9rem;
			letter-spacing: 0.3em;
		}
		.intro h1 {
			margin-block: auto;
			padding: 3.5vw;
			font-size: clamp(3rem, 8vw, 8rem);
			/* Pull the large letters' built-in side spacing back so they line up with the label above */
			margin-left: -0.04em;
		}

		.about p {
			font-size: clamp(2rem, 5vw, 4.5rem);
			font-weight: 600;
			letter-spacing: -0.04em;
			line-height: 1.1;
		}

		.links, .links ul {
			padding: 0;
		}
		.links a {
			display: block;
			padding: clamp(1rem, 4svh, 2rem) 3.5vw;
			font-size: clamp(2.5rem, 6vw, 5rem);
			text-decoration: none;
		}
		.links li + li {
			border-top: var(--line);
		}
		.external {
			position: relative;
			display: inline-block;
			/* Cap height, so the arrow stands as tall as the capitals */
			width: 0.72em;
			margin-left: 0.25em;
		}
		.external svg {
			display: block;
			width: 100%;
			height: auto;
			aspect-ratio: 1;
			overflow: visible;
		}
		/* Matches the text underline, which can't reach an SVG */
		.external::after {
			content: "";
			position: absolute;
			inset-inline: 0;
			top: calc(100% + 0.12em);
			height: 0.08em;
			background: currentColor;
			visibility: hidden;
		}
		.links a:is(:hover, :focus-visible) {
			background: var(--ink);
			color: var(--bg);
			outline: none;
			text-decoration: underline 0.08em;
			text-underline-offset: 0.12em;
		}
		.links a:is(:hover, :focus-visible) .external::after {
			visibility: visible;
		}

		.contact h2 {
			font-size: clamp(2.5rem, 6vw, 5rem);
			margin-bottom: 1.5rem;
		}
		.terminal {
			display: flex;
			background: var(--ink);
			color: var(--bg);
		}
		.terminal code {
			flex: 1;
			min-width: 0;
			padding: 1.5rem;
			/* Base64 has no spaces, so allow breaks anywhere */
			overflow-wrap: anywhere;
			font-size: clamp(0.8rem, 1.4vw, 1.1rem);
		}
		.terminal button {
			flex: none;
			width: 11ch;
			border: 0;
			border-left: 3px solid var(--bg);
			background: none;
			letter-spacing: 0.15em;
			cursor: pointer;
		}

		aside {
			position: fixed;
			top: var(--gap);
			right: var(--gap);
			width: var(--aside);
			display: grid;
			grid-template-rows: var(--row) 1fr min(13rem, 35svh);
			height: var(--section);
			border-left: var(--line);
			background: var(--bg);
		}
		.progress {
			display: grid;
			place-items: center;
			background: linear-gradient(to right, var(--ink) calc(var(--percent) * 1%), transparent 0);
			font-size: 0.9rem;
			font-weight: 700;
			transition: color 0.3s;
		}
		.progress::before {
			counter-reset: percent var(--percent);
			content: counter(percent) "%";
		}
		.progress.filled {
			color: var(--bg);
		}
		.dots {
			--bleed: 24px;
			position: relative;
			cursor: none;
		}
		/* Bleeds past the area so pushed dots can escape its edges; ignores the pointer so it never covers the arrow */
		.dots canvas {
			position: absolute;
			inset: calc(-1 * var(--bleed));
			width: calc(100% + 2 * var(--bleed));
			height: calc(100% + 2 * var(--bleed));
			pointer-events: none;
		}
		.next {
			display: grid;
			place-items: center;
			border: 0;
			background: none;
			cursor: pointer;
			transition: background 0.2s, color 0.2s;
		}
		.next:is(:hover, :focus-visible) {
			background: var(--ink);
			color: var(--bg);
			outline: none;
		}
		.next svg {
			width: min(50%, 7rem);
			transition: rotate 0.4s;
		}
		.next.top svg {
			rotate: 180deg;
		}

		@media (prefers-reduced-motion: reduce) {
			.next svg {
				transition: none;
			}
		}

		@media (max-width: 700px) {
			:root {
				--gap: 12px;
				--bar: 5rem;
				--section: calc(100svh - 2 * var(--gap) - var(--bar));
			}
			body {
				grid-template-columns: minmax(0, 1fr);
				padding-bottom: calc(var(--gap) + var(--bar));
			}
			aside {
				top: auto;
				bottom: var(--gap);
				left: var(--gap);
				width: auto;
				grid-template: auto / 1fr 1fr var(--bar);
				height: var(--bar);
				border-left: 0;
				border-top: var(--line);
			}
			.next svg { width: 2.5rem; }
		}
	</style>
</head>
<body>
	<!-- Shared icons; `hidden` doesn't apply to SVG elements, so it's hidden with display: none -->
	<svg style="display: none">
		<symbol id="external" viewBox="0 0 14 14" fill="none" stroke="currentColor"><path d="M1 13 13 1M3.5 1H13v9.5"/></symbol>
	</svg>
	<main>
		<section class="intro">
			<header class="mono">hello, my name is</header>
			<h1><span data-picture="hello">Daniel<br>Shamburger</span></h1>
		</section>
		<section class="about">
			<p>Makes software.<br>Rides bikes.</p>
		</section>
		<section class="links">
			<ul role="list">
				<li><a href="https://www.linkedin.com/in/danielshamburger/" data-picture="linkedin">LinkedIn<span class="external" aria-hidden="true"><svg><use href="#external"/></svg></span></a></li>
				<li><a href="https://github.com/danielshamburger/" data-picture="github">GitHub<span class="external" aria-hidden="true"><svg><use href="#external"/></svg></span></a></li>
				<li><a href="https://www.strava.com/athletes/2136969" data-picture="strava">Strava<span class="external" aria-hidden="true"><svg><use href="#external"/></svg></span></a></li>
			</ul>
		</section>
		<section class="contact">
			<h2>Get in touch</h2>
			<div class="terminal mono">
				<code>aGVsbG9AZGFuaWVsc2hhbWJ1cmdlci5jb20=</code>
				<button class="mono" type="button" aria-live="polite">COPY</button>
			</div>
		</section>
	</main>
	<aside>
		<div class="progress mono" aria-hidden="true"></div>
		<div class="dots" aria-hidden="true"><canvas></canvas></div>
		<button class="next" type="button" aria-label="Next section">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="miter">
				<path d="M12 2v20M3 13l9 9 9-9"/>
			</svg>
		</button>
	</aside>

	<script type="module">
		const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
		const arrow = document.querySelector('.next');
		const dotArea = document.querySelector('.dots');

		scrollEffects();
		wireDots(dotGrid(dotArea));
		copyButton();

		// Color and percentage come from CSS scroll-driven animations; this handles the thresholds
		// (arrow flip, progress label color) and drives color and percentage itself where CSS can't
		function scrollEffects() {
			const root = document.documentElement;
			const sections = [...document.querySelectorAll('section')];
			const progress = document.querySelector('.progress');
			const supported = CSS.supports('animation-timeline: scroll()');
			// Same stops as @keyframes page-scroll
			const colors = [[129, 192, 139], [240, 195, 216], [137, 190, 227], [236, 223, 138]];
			let starts, maxScroll, scripted, filled, atEnd;

			// Measured on resize only, so scrolling never forces a layout
			function measure() {
				// The scroll position at which each section reaches the top of the frame
				starts = sections.map(section => section.offsetTop - sections[0].offsetTop);
				maxScroll = root.scrollHeight - innerHeight;
				const height = sections[0].offsetHeight;
				scripted = !supported || sections.some(section => Math.abs(section.offsetHeight - height) > 1);
				root.classList.toggle('scripted-scroll', scripted);
				if (!scripted) {
					root.style.removeProperty('--bg');
					root.style.removeProperty('--percent');
				}
				update();
			}

			function update() {
				// Clamped because macOS overscroll reports positions past either end
				const scroll = clamp(scrollY, 0, maxScroll);
				const percent = Math.round(scroll / maxScroll * 100);

				if (scripted) {
					// Blend between the colors of the sections on either side of the scroll position
					const i = clamp(starts.findLastIndex(start => start <= scroll), 0, colors.length - 2);
					const t = Math.min((scroll - starts[i]) / (starts[i + 1] - starts[i]), 1);
					const rgb = colors[i].map((c, n) => Math.round(c + (colors[i + 1][n] - c) * t));
					root.style.setProperty('--bg', `rgb(${rgb})`);
					root.style.setProperty('--percent', percent);
				}

				if (percent >= 50 !== filled) {
					filled = percent >= 50;
					progress.classList.toggle('filled', filled);
				}

				// Flips once the last section is more than halfway in
				const nextAtEnd = scroll >= (starts.at(-2) + starts.at(-1)) / 2;
				if (nextAtEnd !== atEnd) {
					atEnd = nextAtEnd;
					arrow.classList.toggle('top', atEnd);
					arrow.ariaLabel = atEnd ? 'Back to top' : 'Next section';
				}
			}

			arrow.addEventListener('click', () => {
				scrollTo({ top: atEnd ? 0 : starts.find(start => start > scrollY + 1) ?? 0 });
			});
			addEventListener('scroll', update);
			addEventListener('resize', measure);
			// Catches sections growing after fonts load or text is resized
			new ResizeObserver(measure).observe(document.querySelector('main'));
			measure();
		}

		// What makes the dot grid react: the pointer over it, the arrow, the name and links, and a sweep after load
		function wireDots(grid) {
			const ARROW_REACH = 170, SWEEP_DELAY = 1000;

			dotArea.addEventListener('pointermove', e => grid.attract(e.clientX, e.clientY, { cursor: true }));
			dotArea.addEventListener('pointerleave', grid.release);
			dotArea.addEventListener('pointerdown', e => grid.burst(e.clientX, e.clientY));

			// Hovering the arrow pushes dots away from its edge nearest the grid
			arrow.addEventListener('pointerenter', () => {
				const area = dotArea.getBoundingClientRect(), icon = arrow.querySelector('svg').getBoundingClientRect();
				const x = clamp(area.left + area.width / 2, icon.left, icon.right);
				const y = clamp(area.top + area.height / 2, icon.top, icon.bottom);
				grid.attract(x, y, { reach: ARROW_REACH });
			});
			arrow.addEventListener('pointerleave', grid.release);

			// The name and each link draw their picture while hovered or focused
			for (const element of document.querySelectorAll('[data-picture]')) {
				const show = () => grid.show(element.dataset.picture);
				const hide = () => grid.show(null);
				element.addEventListener('pointerenter', show);
				element.addEventListener('focus', show);
				element.addEventListener('pointerleave', hide);
				element.addEventListener('blur', hide);
			}

			if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(grid.sweep, SWEEP_DELAY);
		}

		// A canvas of dots that push away from a point and grow as it gets close, ring out from clicks, and draw small
		// pictures. It knows nothing about the rest of the page: it returns its controls, and wireDots decides what drives them.
		function dotGrid(area) {
			const SPACING = 14, MARGIN = 12, RADIUS = 1.5, REACH = 100, PUSH = 18, GROW = 1.4, EASE = 0.2;
			const BURST_DURATION = 600, BURST_REACH = 320, BURST_WIDTH = 30, BURST_PUSH = 18, BURST_GROW = 1.5;
			const SWEEP_DURATION = 1200, SWEEP_STRENGTH = 0.7, SWEEP_FROM = 0.15, SWEEP_TO = 0.85;
			const PICTURE_GROW = 1.3, PICTURE_DIM = 0.6;
			// One character per dot; at most 11 wide so they fit the narrowest sidebar
			const PICTURES = {
				hello: [
					'##.....##',
					'##.....##',
					'##.......',
					'######.##',
					'##..##.##',
					'##..##.##',
					'##..##.##',
					'##..##.##',
					'##..##.##',
				],
				linkedin: [
					'##.........',
					'##.........',
					'...........',
					'##.##.###..',
					'##.#######.',
					'##.##...##.',
					'##.##...##.',
					'##.##...##.',
					'##.##...##.',
				],
				github: [
					'.#########.',
					'.#.#.....#.',
					'.#..#....#.',
					'.#.#.....#.',
					'.#.......#.',
					'.#########.',
					'###########',
				],
				strava: [
					'..###..##..',
					'...#....#..',
					'...######..',
					'...#..#.#..',
					'.##.##..##.',
					'#..#.#.#..#',
					'#..#...#..#',
					'.##.....##.',
				],
			};

			const canvas = area.querySelector('canvas');
			const ctx = canvas.getContext('2d');
			const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink');
			const bleed = Number.parseFloat(getComputedStyle(area).getPropertyValue('--bleed'));

			// Geometry is rebuilt on resize and never modified; state changes only through the controls and step()
			let geometry;
			const state = {
				field: { x: 0, y: 0, reach: REACH, cursor: false }, // the point the dots push away from
				strength: 0, // how hard the field pushes right now, easing toward target
				target: 0,
				bursts: [], // click shockwaves still expanding
				sweep: null, // the load-time sweep while it runs
				picture: null, // name of the picture to draw
				dim: 0, // how far the dots outside the picture have shrunk
				lit: [], // per dot, how far it has grown into the picture
			};
			let frame = null;

			// Moves a value a step toward its goal, snapping once it's close enough to stop animating
			const ease = (value, goal) => {
				const next = value + (goal - value) * EASE;
				return Math.abs(goal - next) < 0.001 ? goal : next;
			};

			// Where the dots sit for a given size
			function layout(width, height) {
				// Same margin on every side; spacing stretches a fraction of a pixel per axis to fit exactly
				const axis = size => {
					const n = Math.max(1, Math.round((size - 2 * MARGIN) / SPACING));
					return Array.from({ length: n + 1 }, (_, i) => MARGIN + i * (size - 2 * MARGIN) / n);
				};
				const xs = axis(width), ys = axis(height);

				// The bleed ring around the area, where shapes are drawn in ink instead of cut out
				const outside = new Path2D();
				outside.rect(-bleed, -bleed, width + 2 * bleed, height + 2 * bleed);
				outside.rect(0, 0, width, height);

				const dots = ys.flatMap((y, row) => xs.map((x, col) => ({ x, y, col, row })));
				return { width, height, cols: xs.length, rows: ys.length, dots, outside };
			}

			function resize() {
				const { width, height } = area.getBoundingClientRect();
				canvas.width = (width + 2 * bleed) * devicePixelRatio;
				canvas.height = (height + 2 * bleed) * devicePixelRatio;
				// Draw in the area's coordinates; the bleed sits at negative/overflow positions
				ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, bleed * devicePixelRatio, bleed * devicePixelRatio);
				geometry = layout(width, height);
				state.lit = geometry.dots.map(() => 0);
				draw(performance.now());
			}

			// Advances the state one frame; returns whether anything is still moving
			function step(now) {
				const { width, height, cols, rows, dots } = geometry;

				if (state.sweep) {
					// Push a cursor-less bulge from top to bottom, then end with a burst
					const t = Math.min((now - state.sweep.start) / SWEEP_DURATION, 1);
					const eased = (1 - Math.cos(t * Math.PI)) / 2;
					state.field = { x: width / 2, y: height * (SWEEP_FROM + (SWEEP_TO - SWEEP_FROM) * eased), reach: REACH, cursor: false };
					state.strength = Math.sin(t * Math.PI) * SWEEP_STRENGTH;
					if (t === 1) {
						state.sweep = null;
						state.bursts.push({ x: state.field.x, y: state.field.y, start: now });
					}
				} else {
					state.strength = ease(state.strength, state.target);
				}
				state.bursts = state.bursts.filter(burst => now - burst.start < BURST_DURATION);

				// The picture, centered in the grid: its dots grow and the rest shrink
				const bitmap = PICTURES[state.picture];
				const fits = Boolean(bitmap) && bitmap.length <= rows && bitmap[0].length <= cols;
				const top = fits ? Math.floor((rows - bitmap.length) / 2) : 0;
				const left = fits ? Math.floor((cols - bitmap[0].length) / 2) : 0;
				state.dim = ease(state.dim, fits ? 1 : 0);
				let settled = state.dim === (fits ? 1 : 0);
				dots.forEach(({ col, row }, i) => {
					const goal = fits && bitmap[row - top]?.[col - left] === '#' ? 1 : 0;
					state.lit[i] = ease(state.lit[i], goal);
					settled &&= state.lit[i] === goal;
				});

				return Boolean(state.sweep) || state.bursts.length > 0 || state.strength !== state.target || !settled;
			}

			// Paints the current state; reads it, never changes it
			function draw(now) {
				const { width, height, dots } = geometry;
				const { field, strength, bursts, dim, lit } = state;

				ctx.globalCompositeOperation = 'source-over';
				ctx.globalAlpha = 1;
				ctx.clearRect(-bleed, -bleed, width + 2 * bleed, height + 2 * bleed);
				ctx.fillStyle = ctx.strokeStyle = ink;
				ctx.fillRect(0, 0, width, height);

				const path = new Path2D();
				dots.forEach(({ x, y }, i) => {
					const dx = x - field.x, dy = y - field.y, distance = Math.hypot(dx, dy) || 1;
					const falloff = strength * Math.max(0, 1 - distance / field.reach) ** 2;
					let cx = x + dx / distance * falloff * PUSH, cy = y + dy / distance * falloff * PUSH;
					let r = RADIUS * (1 + GROW * falloff + PICTURE_GROW * lit[i] - PICTURE_DIM * dim * (1 - lit[i]));

					// Each burst is a ring that expands from the click and fades as it goes
					for (const burst of bursts) {
						const age = (now - burst.start) / BURST_DURATION;
						const bx = x - burst.x, by = y - burst.y, d = Math.hypot(bx, by) || 1;
						const wave = Math.max(0, 1 - Math.abs(d - age * BURST_REACH) / BURST_WIDTH) * (1 - age) ** 2;
						cx += bx / d * wave * BURST_PUSH;
						cy += by / d * wave * BURST_PUSH;
						r += RADIUS * BURST_GROW * wave;
					}
					path.moveTo(cx + r, cy);
					path.arc(cx, cy, r, 0, Math.PI * 2);
				});
				cut(path, 'fill');

				if (field.cursor && strength > 0.01) {
					ctx.globalAlpha = strength;
					ctx.lineWidth = 2;
					cut(cursor(field.x, field.y), 'stroke');
				}
			}

			// Inside the area, punch the shape out of the ink; outside it, draw the shape in ink so it reads the same
			function cut(path, method) {
				ctx.globalCompositeOperation = 'destination-out';
				ctx[method](path);

				ctx.save();
				ctx.clip(geometry.outside, 'evenodd');
				ctx.globalCompositeOperation = 'source-over';
				ctx[method](path);
				ctx.restore();
			}

			// Rounded viewfinder brackets centered on a point
			function cursor(cx, cy) {
				const half = 14, corner = 3, arm = 4, path = new Path2D();
				for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
					const x = cx + sx * half, y = cy + sy * half;
					path.moveTo(x, y - sy * (corner + arm));
					path.arcTo(x, y, x - sx * corner, y, corner);
					path.lineTo(x - sx * (corner + arm), y);
				}
				return path;
			}

			function tick() {
				const now = performance.now();
				const moving = step(now);
				draw(now);
				frame = moving ? requestAnimationFrame(tick) : null;
			}

			function animate() {
				frame ??= requestAnimationFrame(tick);
			}

			// Viewport coordinates to the area's
			function local(x, y) {
				const { left, top } = area.getBoundingClientRect();
				return { x: x - left, y: y - top };
			}

			// Controls. Points are viewport coordinates, like pointer events give.

			function attract(x, y, { reach = REACH, cursor = false } = {}) {
				state.sweep = null;
				state.field = { ...local(x, y), reach, cursor };
				state.target = 1;
				animate();
			}

			function release() {
				state.target = 0;
				animate();
			}

			function burst(x, y) {
				state.bursts.push({ ...local(x, y), start: performance.now() });
				animate();
			}

			// Draws a picture by name, or clears it with null; a picture also ends the sweep
			function show(name) {
				state.picture = name;
				if (name) state.sweep = null;
				animate();
			}

			// Runs the sweep, unless the dots are already busy with the pointer or a picture
			function sweep() {
				if (state.target || state.picture) return;
				state.sweep = { start: performance.now() };
				animate();
			}

			resize();
			new ResizeObserver(resize).observe(area);

			return { attract, release, burst, show, sweep };
		}

		// Copies the encoded address; if the clipboard is blocked, selects it for a manual copy instead
		function copyButton() {
			const button = document.querySelector('.terminal button');
			const code = document.querySelector('.terminal code');
			let reset;

			button.addEventListener('click', async () => {
				try {
					await navigator.clipboard.writeText(code.textContent);
					button.textContent = 'COPIED';
				} catch {
					getSelection().selectAllChildren(code);
					button.textContent = 'FAILED';
				}
				clearTimeout(reset);
				reset = setTimeout(() => button.textContent = 'COPY', 1500);
			});
		}
	</script>
</body>
</html>
